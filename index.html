<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Socket.IO chat</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #form1 {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
        position: relative;
      }

      #inputTest {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #messages > li {
        padding: 0.5rem 1rem;
      }
      #messages > li:nth-child(odd) {
        background: #efefef;
      }
    </style>
  </head>
  <body>
    <a href="/" id="mainBtn">Connect to /main chat</a>
    <a href="/test1" id="nps1Btn">Connect to /nps1</a>
    <a href="/test2" id="nps2Btn">Connect to /nps2</a>
    <!-- <div id="output"></div> -->
    <form id="form1" action="">
      <input id="inputTest" autocomplete="off" placeholder="userId" />
    </form>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
      <button id="toggle-btn">Disconnect</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // Client delivery

      let counter = 0;
      let count = 0;

      //Server delivery connectionStateRecovery
      const socket = io({
        auth: {
          serverOffset: 0,
        },
        // Client delivery
        // enable retries
        ackTimeout: 10000,
        retries: 3,
      });

      // setInterval(() => {
      //   socket.volatile.emit("ping send", ++count);
      // }, 1000);

      //Namespaces
      // const nps1 = io("/test1");
      // const nps2 = io("/test2");
      let nps1Socket;
      let nps2Socket;

      // const socket1 = io("http://localhost:3000/test1", { forceNew: false  });
      // const socket2 = io("http://localhost:3000/test2", { forceNew: false  });

      // Acknowledgements With a Promise
      async function sendRequest() {
        try {
          const response = await socket
            .timeout(5000)
            .emitWithAck("requestB", { foo: "bar" }, "baz");
          console.log("requestB : ", response.status);
        } catch (e) {
          console.error("⛔ Timeout or no acknowledgment from server:", e);
        }
      }

      sendRequest();

      socket.on("connect", () => {
        console.log("Connected:", socket.id);
      });
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const input1 = document.getElementById("inputTest");
      const messages = document.getElementById("messages");
      const toggleButton = document.getElementById("toggle-btn");
      const output = document.getElementById("output");

      document.getElementById("nps1Btn").onclick = () => {
        if (nps2Socket && nps2Socket.connected) {
          nps2Socket.disconnect();
          output.innerHTML += `<p>[nps2] disconnected</p>`;
        }
        if (socket.connected) {
          toggleButton.innerText = "Connect";
          socket.disconnect();
          output.innerHTML += `<p>[Main Chat] disconnected</p>`;
        }

        if (!nps1Socket || !nps1Socket.connected) {
          nps1Socket = io("/test1");
          nps1Socket.on("welcome", (msg) => {
            output.innerHTML += `<p>[nps1] ${msg}</p>`;
          });
        } else {
          output.innerHTML += `<p>[nps1] already connected</p>`;
        }
      };

      document.getElementById("nps2Btn").onclick = () => {
        // 👇 disconnect from /test1 first if needed
        if (nps1Socket && nps1Socket.connected) {
          nps1Socket.disconnect();
          output.innerHTML += `<p>[nps1] disconnected</p>`;
        }
        if (socket.connected) {
          toggleButton.innerText = "Connect";
          socket.disconnect();
          output.innerHTML += `<p>[Main Chat] disconnected</p>`;
        }
        // then connect to /test2
        if (!nps2Socket || !nps2Socket.connected) {
          nps2Socket = io("/test2");
          nps2Socket.on("welcome", (msg) => {
            output.innerHTML += `<p>[nps2] ${msg}</p>`;
          });
        } else {
          output.innerHTML += `<p>[nps2] already connected</p>`;
        }
      };

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (input.value && input1.value) {
          const clientOffset = `${socket.id}-${counter++}`;

          socket.emit(
            "chat message",
            input.value,
            input1.value,
            clientOffset,
            (response) => {
              console.log("Client : ", response);
            }
          );
          input.value = "";
        } else {
          const clientOffset = `${socket.id}-${counter++}`;
          socket.emit(
            "chat message",
            input.value,
            null,
            clientOffset,
            (response) => {
              console.log("Client : ", response);
            }
          );
          // Client delivery
          // compute a unique offset
          input.value = "";
          console.log("🚀 auth ~ serverOffset:", socket.auth);
        }
      });

      toggleButton.addEventListener("click", (e) => {
        e.preventDefault();
        if (nps1Socket && nps1Socket.connected) {
          nps1Socket.disconnect();
          output.innerHTML += `<p>[nps1] disconnected</p>`;
        }
        if (nps2Socket && nps2Socket.connected) {
          nps2Socket.disconnect();
          output.innerHTML += `<p>[nps2] disconnected</p>`;
        }
        if (socket.connected) {
          toggleButton.innerText = "Connect";
          socket.disconnect();
        } else {
          toggleButton.innerText = "Disconnect";
          socket.connect();
          output.innerHTML += `<p>[Main Chat] connected</p>`;
        }
      });

      socket.on("chat message", (data, serverOffset) => {
        console.log("message front: " + data);
        const { id, msg } = data;
        const item = document.createElement("li");
        item.textContent = msg;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
        //Server delivery connectionStateRecovery
        socket.auth.serverOffset = serverOffset;
      });
      //Basic emit
      socket.emit("hello", 1, "2", { 3: "4", 5: Uint8Array.from([6]) });
      //Acknowledgements
      socket.on("request", (arg1, arg2, callback) => {
        console.log(arg1); // { foo: 'bar' }
        console.log(arg2); // 'baz'
        callback({
          status: "ok",
        });
      });

      //Broadcasting
      socket.on("user joined", (data, callback) => {
        console.log("user joined", data.id);
        callback(`Welcome ${data.id}!`);
      });
    </script>
  </body>
</html>
